name: CI

# 只做可确定的校验：格式、静态分析、Dart 单元测试、Android debug 构建与 Kotlin 单测。
# HarmonyOS HAP 需要 HarmonyOS SDK，macOS 构建需要 macOS runner，均不在 CI 内，
# 由发版前的本地构建覆盖。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本地 OHOS 分支 3.35.8-ohos-1.0.1 对应的上游稳定版本（Dart 3.9.2）。
  # 升级本地 Flutter 时同步修改此处。
  FLUTTER_VERSION: 3.35.7

jobs:
  check:
    name: 格式 / 分析 / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 解析依赖
        run: flutter pub get

      - name: 格式检查
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: 静态分析
        run: flutter analyze --no-pub

      - name: 单元测试
        run: flutter test --no-pub

  android:
    name: Android debug 构建与 Kotlin 单测
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 解析依赖
        run: flutter pub get

      # debug 构建不依赖仓库外的正式签名配置；release 构建在 CI 中不可用是有意为之。
      - name: 构建 debug APK
        run: flutter build apk --debug --no-pub

      # flutter build 会生成 android/local.properties，Gradle 才能定位 Flutter SDK。
      - name: Kotlin 单元测试
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
