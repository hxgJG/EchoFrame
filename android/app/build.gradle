plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def releaseProperties = new Properties()
def releaseConfig = new File(System.getenv('LUMIO_RELEASE_CONFIG') ?: "${System.getProperty('user.home')}/.lumio-release/android-signing.properties")
if (releaseConfig.exists()) releaseConfig.withInputStream { releaseProperties.load(it) }
def wantsRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (wantsRelease && (!releaseConfig.exists() || ['storeFile', 'storePassword', 'keyPassword', 'keyAlias'].any { !releaseProperties.getProperty(it) })) {
    throw new GradleException('Release 构建必须配置仓库外的正式签名密钥，不允许使用 debug 签名。')
}

android {
    namespace = "com.hxg.lumio"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.hxg.lumio"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            if (releaseConfig.exists()) {
                storeFile = file(releaseProperties.getProperty('storeFile'))
                storePassword = releaseProperties.getProperty('storePassword')
                keyPassword = releaseProperties.getProperty('keyPassword')
                keyAlias = releaseProperties.getProperty('keyAlias')
            }
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Lumio-${variant.versionName}-${variant.versionCode}-android-universal.apk"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    implementation "com.tencent:mmkv:1.3.9"
    def media3Version = "1.10.1"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "com.mpatric:mp3agic:0.9.1"
}
